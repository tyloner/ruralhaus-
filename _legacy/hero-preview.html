<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RuralHaus — Hero Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #FAFAF7;
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: #1A1714;
    }

    /* ── Navbar ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      background: rgba(250, 250, 247, 0.97);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(140, 123, 110, 0.10);
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 80px;
      justify-content: space-between;
    }

    .nav-logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 13px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #1A1714;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 44px;
      list-style: none;
    }

    .nav-links a {
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #8C7B6E;
      text-decoration: none;
      transition: color 0.3s;
    }

    .nav-links a:hover { color: #1A1714; }

    /* ── Hero ── */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
    }

    .hero video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: rgba(26, 23, 20, 0.22);
    }

    .hero-content {
      position: relative;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 80px 96px;
    }

    .hero-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 300;
      color: #fff;
      line-height: 0.88;
      font-size: clamp(3.5rem, 11vw, 9.5rem);
      margin-bottom: 24px;
    }

    .hero-title span { display: block; }

    .hero-sub {
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.65;
      color: rgba(255,255,255,0.5);
      max-width: 280px;
    }

    .scroll-label {
      position: absolute;
      bottom: 32px;
      right: 80px;
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 8px;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      writing-mode: vertical-rl;
    }

    /* ── Toggle ── */
    .variant-toggle {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 0;
      border: 1px solid rgba(140,123,110,0.3);
      background: rgba(250,250,247,0.95);
      backdrop-filter: blur(8px);
    }

    .variant-toggle button {
      padding: 10px 20px;
      font-family: -apple-system, 'Inter', sans-serif;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #8C7B6E;
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .variant-toggle button.active {
      background: #1A1714;
      color: #FAFAF7;
    }

    .variant-toggle button:not(.active):hover { color: #1A1714; }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
    <a href="#" class="nav-logo">RuralHaus</a>
    <ul class="nav-links">
      <li><a href="#">Concepto</a></li>
      <li><a href="#">Regiones</a></li>
      <li><a href="#">Producto</a></li>
      <li><a href="#">Filosofía</a></li>
      <li><a href="#">Contacto</a></li>
    </ul>
    <span style="font-family: sans-serif; font-size: 9px; letter-spacing: 0.2em; color: #8C7B6E;">ES · EN</span>
  </nav>

  <!-- Hero -->
  <section class="hero" id="hero">
    <video
      id="hero-video"
      src="C:/Users/wofa1/Downloads/seedance2_Video_20260623_201429.mp4"
      autoplay
      muted
      loop
      playsinline
    ></video>
    <div class="hero-overlay" id="overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">
        <span>Entre</span>
        <span>la sierra</span>
        <span>y el silencio.</span>
      </h1>
      <p class="hero-sub">Casas rurales revitalizadas en las sierras y costas más íntimas de España. De bajo impacto, profundamente integradas en la naturaleza.</p>
    </div>
    <span class="scroll-label">Scroll</span>
  </section>

  <!-- Overlay intensity toggle -->
  <div class="variant-toggle">
    <button onclick="setOverlay(0.10)" id="btn-light">Ligero 10%</button>
    <button onclick="setOverlay(0.22)" id="btn-mid" class="active">Medio 22%</button>
    <button onclick="setOverlay(0.38)" id="btn-dark">Oscuro 38%</button>
  </div>

  <script>
    function setOverlay(opacity) {
      document.getElementById('overlay').style.background = `rgba(26,23,20,${opacity})`;
      document.querySelectorAll('.variant-toggle button').forEach(b => b.classList.remove('active'));
      const pct = Math.round(opacity * 100);
      document.querySelectorAll('.variant-toggle button').forEach(b => {
        if (b.textContent.includes(pct + '%')) b.classList.add('active');
      });
    }
  </script>

</body>
</html>
